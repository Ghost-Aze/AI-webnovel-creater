[package]
name = "webnovel-ai-studio"
version = "0.1.0"
description = "Webnovel AI Studio desktop and mobile shell"
authors = ["Webnovel AI Studio contributors"]
edition = "2021"

[lib]
name = "webnovel_ai_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
tauri-app = ["dep:tauri", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [], optional = true }

[dependencies]
tauri = { version = "2.8.4", features = ["wry"], optional = true }
