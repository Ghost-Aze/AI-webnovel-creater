[package]
name = "webnovel-ai-studio"
version = "0.1.0"
description = "Webnovel AI Studio desktop and mobile shell"
authors = ["Webnovel AI Studio contributors"]
edition = "2021"

[lib]
name = "webnovel_ai_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
tauri-app = ["dep:tauri", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [], optional = true }

[dependencies]
chrono = { version = "0.4.41", features = ["clock", "serde"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
tauri = { version = "2.8.4", features = ["wry"], optional = true }
